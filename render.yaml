        value: "240899"
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: SUPABASE_URL
        value: "https://rslvwhvcvvljzwhovkux.supabase.co"
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
