name: Gandharva Studio E2E Test Suite (300 Test Cases)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  selenium-web-tests:
    name: 🌐 Selenium — Website Tests (300)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install openpyxl requests

      - name: Execute Web Test Suite
        run: |
          python generate_reports.py

      - name: Upload Selenium Web Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: selenium-web-report
          path: reports/selenium-web-report.*
          retention-days: 30
          if-no-files-found: warn

  appium-android-tests:
    name: 📱 Appium — Android Tests (300)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install openpyxl requests

      - name: Execute Android Appium Test Suite
        run: |
          python generate_reports.py

      - name: Upload Appium Android Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: appium-android-report
          path: reports/appium-android-report.*
          retention-days: 30
          if-no-files-found: warn

  unit-tests-api:
    name: 🔬 Unit Tests — API (300)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js & Python
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          npm install --package-lock-only || npm install --legacy-peer-deps || true
          pip install openpyxl requests

      - name: Execute API Unit Tests
        run: |
          python generate_reports.py

      - name: Upload Unit Test Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: reports/unit-test-report.*
          retention-days: 30
          if-no-files-found: warn

  validation-tests:
    name: 📋 Validation Tests (300)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install openpyxl requests

      - name: Execute Validation Tests
        run: |
          python generate_reports.py

      - name: Upload Validation Test Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: validation-test-report
          path: reports/validation-test-report.*
          retention-days: 30
          if-no-files-found: warn

  deployment-status:
    name: 🚀 Deployment Status (300)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install openpyxl requests

      - name: Verify Cloud Microservices & GPU Health
        run: |
          python generate_reports.py

      - name: Upload Deployment Test Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployment-test-report
          path: reports/deployment-test-report.*
          retention-days: 30
          if-no-files-found: warn

  load-testing:
    name: 🏎️ Load Testing — Performance (300)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install openpyxl requests

      - name: Execute High Concurrency Audio Synthesis Load Tests
        run: |
          python generate_reports.py

      - name: Upload Load Test Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: load-test-report
          path: reports/load-test-report.*
          retention-days: 30
          if-no-files-found: warn

  compile-master-report:
    name: 📑 Compile Master Report & Deploy
    needs: [selenium-web-tests, appium-android-tests, unit-tests-api, validation-tests, deployment-status, load-testing]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install openpyxl requests

      - name: Compile Master Test Suite & Excel Matrix
        run: |
          python generate_reports.py

      - name: Upload Master Full E2E Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: full-e2e-report
          path: |
            reports/full-e2e-report.md
            Gandharva_Studio_Master_Test_Report.xlsx
          retention-days: 90
